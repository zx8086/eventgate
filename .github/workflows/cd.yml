# Build, push, scan Docker image. Runs on push to default branch and tags.
name: CD

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: zx8086/eventgate

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Docker Hub login must come BEFORE setup-buildx-action when using
      # driver: cloud (the cloud builder is authorised via the Docker Hub session).
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker Build Cloud — native arm64, no QEMU.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: zx8086/cldbuild

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{date 'YYYYMMDD'}}-

      # Default build targets the distroless `production` stage (Tier 2).
      # DHI_IMAGE defaults to gcr.io/distroless/static-debian12:nonroot inside
      # the Dockerfile; swap to dhi.io/static:<tag> once a DHI subscription is
      # provisioned (tracked separately) — no Dockerfile change needed.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            SERVICE_NAME=eventgate
            SERVICE_VERSION=${{ github.ref_name }}
            SERVICE_DESCRIPTION=Bun ingestion service for Elastic AutoOps webhooks
            SERVICE_AUTHOR=Siobytes
            SERVICE_LICENSE=UNLICENSED

  scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Trivy pulls the image from Docker Hub. Anonymous pulls from CI runners
      # get rate-limited (or 401'd outright); a logged-in session lifts that.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - if: hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
